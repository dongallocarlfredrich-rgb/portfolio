<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carl Fredrich | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, rgba(255, 212, 59, 0.12), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 180, 255, 0.12), transparent 30%),
                #081a2d;

            font-family: Arial, sans-serif;
            color: white;
        }

        /* =========================
           BACKGROUND CIRCLES
        ========================= */

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .circle.one {
            width: 450px;
            height: 450px;
            animation: rotate 20s linear infinite;
        }

        .circle.two {
            width: 650px;
            height: 650px;
            animation: rotateReverse 30s linear infinite;
        }

        .circle.three {
            width: 800px;
            height: 800px;
            border-color: rgba(255, 212, 59, 0.04);
            animation: rotate 40s linear infinite;
        }


        /* =========================
           FLOATING PARTICLES
        ========================= */

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ffd43b;
            border-radius: 50%;
            opacity: 0.5;

            animation: float 6s ease-in-out infinite;
        }

        .p1 {
            left: 15%;
            top: 25%;
            animation-delay: 0s;
        }

        .p2 {
            left: 80%;
            top: 20%;
            animation-delay: 2s;
        }

        .p3 {
            left: 25%;
            top: 75%;
            animation-delay: 1s;
        }

        .p4 {
            left: 75%;
            top: 75%;
            animation-delay: 3s;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .landing {
            position: relative;
            z-index: 2;
            text-align: center;
        }


        /* Welcome animation */

        .welcome {
            font-size: 15px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffd43b;
            margin-bottom: 18px;

            opacity: 0;
            animation: slideDown 1s ease forwards;
        }


        /* Portfolio animation */

        .landing h1 {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 15px;
            letter-spacing: -2px;

            opacity: 0;
            animation: zoomIn 1.2s ease forwards;
            animation-delay: 0.3s;
        }

        .landing h1 span {
            color: #ffd43b;

            text-shadow:
                0 0 10px rgba(255, 212, 59, 0.15),
                0 0 30px rgba(255, 212, 59, 0.08);
        }


        /* Name */

        .name {
            font-size: 20px;
            opacity: 0;

            animation: slideUp 1s ease forwards;
            animation-delay: 0.7s;
        }


        /* Course */

        .course {
            font-size: 15px;
            opacity: 0;

            margin-top: 8px;
            margin-bottom: 35px;

            animation: slideUp 1s ease forwards;
            animation-delay: 0.9s;
        }

     /* =========================
   PORTFOLIO BUTTON
========================= */

.portfolio-btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    padding: 16px 42px;

    background: #ffd43b;
    color: #081a2d;

    text-decoration: none;

    font-size: 17px;
    font-weight: bold;

    border-radius: 50px;

    position: relative;

    overflow: hidden;

    opacity: 0;

    animation:
        buttonAppear 1s ease forwards,
        pulse 2.5s ease-in-out infinite;

    animation-delay: 1.1s, 2.5s;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}


.portfolio-btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75),
        transparent
    );

    transform: skewX(-20deg);

    transition: left 0.6s ease;

    pointer-events: none;
}

.portfolio-btn:hover {

    transform: translateY(-6px);

    background: #fff4a8;

    box-shadow:
        0 0 15px rgba(255, 212, 59, 0.8),
        0 0 30px rgba(255, 212, 59, 0.6),
        0 0 55px rgba(255, 212, 59, 0.35);
}

.portfolio-btn:hover::before {
    left: 130%;
}

.portfolio-btn:active {
    transform: translateY(-2px) scale(0.97);
}  

.portfolio-btn:active {
    transform: translateY(-1px) scale(0.97);
}
        
        .tech {
            margin-top: 40px;

            font-size: 12px;
            letter-spacing: 2px;

            opacity: 0;

            animation: fadeIn 1.5s ease forwards;
            animation-delay: 1.4s;
        }

        @keyframes slideDown {

            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 0.8;
                transform: translateY(0);
            }
        }


        @keyframes zoomIn {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes buttonAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 0.45;
            }
        }


        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 rgba(255, 212, 59, 0);
            }

            50% {
                box-shadow:
                    0 0 25px rgba(255, 212, 59, 0.18);
            }
        }


        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        @keyframes rotateReverse {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }


        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-35px);
                opacity: 0.8;
            }
        }


        @media (max-width: 600px) {

            .landing h1 {
                font-size: 45px;
            }

            .welcome {
                font-size: 12px;
                letter-spacing: 4px;
            }

            .name {
                font-size: 17px;
            }

            .course {
                font-size: 13px;
            }

            .circle.one {
                width: 300px;
                height: 300px;
            }

            .circle.two {
                width: 450px;
                height: 450px;
            }

            .circle.three {
                width: 550px;
                height: 550px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <!-- Floating particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>


    <!-- Landing page -->

    <div class="landing">

        <div class="welcome">
            Welcome to my
        </div>

        <h1>
            <span>PORTFOLIO</span>
        </h1>

        <p class="name">
            Carl Fredrich B. Dongallo
        </p>

        <p class="course">
            BS Information Technology Student
        </p>

        <a href="portfolio.html" class="portfolio-btn">
            ENTER PORTFOLIO →
        </a>

        <div class="tech">
            HTML • CSS • JAVA • C# • UI DESIGN
        </div>

    </div>

</body>
</html>
